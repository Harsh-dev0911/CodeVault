<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeVault - Register</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="glass-panel auth-box">
        <h2
          style="text-align: center; margin-bottom: 2rem; color: var(--primary)"
        >
          Join CodeVault
        </h2>
        <form id="register-form">
          <div class="form-group">
            <label>Username</label>
            <input
              type="text"
              id="username"
              class="input-field"
              required
              placeholder="johndoe"
            />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="email"
              class="input-field"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              id="password"
              class="input-field"
              required
              placeholder="••••••••"
            />
          </div>
          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 1rem"
          >
            Sign Up
          </button>
        </form>
        <p
          style="
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
          "
        >
          Already have an account?
          <a href="/index.html" style="color: var(--primary)">Login</a>
        </p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
